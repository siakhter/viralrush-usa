backend:
  name: git-gateway
  branch: main

media_folder: "content/images"
public_folder: "/content/images"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "General Settings"
        name: "settings"
        fields:
          - { label: "Contact Section Heading", name: "contact_heading", widget: "string" }
          - { label: "Contact Section Subtext", name: "contact_subtext", widget: "text" }
          - { label: "Contact Description Paragraph", name: "contact_description", widget: "text" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
          - { label: "Focus (topics)", name: "contact_focus", widget: "string" }
          - { label: "Audience Description", name: "contact_audience", widget: "string" }

  - name: "stories"
    label: "Stories"
    files:
      - file: "content/stories.json"
        label: "All Stories"
        name: "stories"
        fields:
          - label: "Stories"
            name: "stories"
            widget: "list"
            summary: "{{fields.title}} — {{fields.section}}"
            fields:
              - { label: "Section", name: "section", widget: "select", options: ["trending", "stories", "mystery", "emotional", "entertainment", "facts"], hint: "Which page section this story appears in" }
              - { label: "Tag 1", name: "tag1", widget: "string" }
              - { label: "Tag 2", name: "tag2", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Full Story Content (shown on Read Story page)", name: "content", widget: "text", required: false, hint: "This is the full article text shown when someone clicks Read Story. Separate paragraphs with a blank line." }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Read Time", name: "readtime", widget: "string", default: "3 min read" }
              - { label: "Link (optional)", name: "link", widget: "string", required: false, default: "#" }

  - name: "ads"
    label: "Advertisements"
    files:
      - file: "content/ads.json"
        label: "Ad Placements"
        name: "ads"
        fields:
          - { label: "Ad Code — Trending section (below)", name: "ad_trending", widget: "text", required: false, hint: "Paste raw Adsterra ad code (HTML/JS). Leave empty to show the placeholder." }
          - { label: "Ad Code — Latest Stories section (below)", name: "ad_stories", widget: "text", required: false, hint: "Paste raw Adsterra ad code (HTML/JS). Leave empty to show the placeholder." }
          - { label: "Ad Code — Mystery Stories section (below)", name: "ad_mystery", widget: "text", required: false, hint: "Paste raw Adsterra ad code (HTML/JS). Leave empty to show the placeholder." }
          - { label: "Ad Code — Entertainment section (below)", name: "ad_entertainment", widget: "text", required: false, hint: "Paste raw Adsterra ad code (HTML/JS). Leave empty to show the placeholder." }
          - { label: "Ad Code — Story Page (top, above article)", name: "ad_article_top", widget: "text", required: false, hint: "Shows on the Read Story page, above the article content." }
          - { label: "Ad Code — Story Page (bottom, below article)", name: "ad_article_bottom", widget: "text", required: false, hint: "Shows on the Read Story page, below the article content." }
